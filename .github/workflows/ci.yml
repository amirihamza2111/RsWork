name: CI

on:
  push:
    branches: [main, supabase-migration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` first, so this is also the typecheck.
      - run: npm run build
        env:
          # Placeholders: CI only proves the app compiles. Vercel builds the
          # real bundle with the project's own (public) values.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  functions:
    name: Edge Functions (deno check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check */index.ts
      - run: deno test --allow-net

  ml-service:
    name: ML service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration + security tests (live Supabase)
    # Runs against the real project, so only on pushes/manual runs (never on
    # pull requests from forks) and only once the repository secrets are set.
    if: github.event_name != 'pull_request'
    needs: [frontend, functions]
    runs-on: ubuntu-latest
    concurrency:
      group: integration
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check that the Supabase secrets are configured
        id: config
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ] && [ -n "$SUPABASE_SECRET_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Integration tests skipped: add SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY and SUPABASE_SECRET_KEY as repository secrets."
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      # The scripts read a .env file; it only exists for the duration of the job.
      - if: steps.config.outputs.ready == 'true'
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY"
          } > .env
      - if: steps.config.outputs.ready == 'true'
        run: npm test
