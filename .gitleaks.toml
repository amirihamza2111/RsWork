# gitleaks configuration (used by the CI "secrets" job).
title = "RsWork"

[extend]
useDefault = true

# The security tests send throwaway passwords on purpose (e.g. proving that a
# co-manager cannot reset the owner's password). Only the heuristic
# generic-api-key rule is relaxed, and only in test files: every provider-
# specific rule (Stripe, Supabase, AWS, private keys, ...) still applies there.
[[allowlists]]
description = "Throwaway passwords in the test suites"
targetRules = ["generic-api-key"]
paths = ['''^tests/.*\.test\.mjs$''']
