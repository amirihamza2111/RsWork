# RsWork — Render Blueprint (forecast microservice only).
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Everything else runs on Supabase (database, auth, realtime, storage, Edge
# Functions) and the frontend on Vercel — see DEPLOYMENT.md.
services:
  - type: web
    name: rswork-ml
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
