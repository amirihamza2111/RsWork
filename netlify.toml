# Netlify — frontend deploy (Vite SPA). Monorepo: the build runs inside frontend/.
# Importing the repo in Netlify picks this up automatically — no UI settings needed.
[build]
  base = "frontend"
  command = "npm run build"
  # publish is resolved RELATIVE TO base — so this is frontend/dist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# BrowserRouter SPA — every route (table QR links like /menu?tableId=..., deep
# links, refreshes) must serve index.html; React Router takes it from there.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always revalidate so app updates roll out immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
